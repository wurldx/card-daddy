<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Floating Card Hero</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Replace each <img src> below with your own image (about 4:3). Card shape, position and perspective are set by the CSS. -->

    </figure>
    <figure class="card card--second" style="--w:538px;--h:407px;--z:2">
      <img src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22524%22 height=%22393%22 viewBox=%220 0 524 393%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23c5cfc6%22/%3E%3Cstop offset=%221%22 stop-color=%22%237f9484%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22524%22 height=%22393%22 fill=%22url%28%23g%29%22/%3E%3Cpath d=%22M0 0L524 393M524 0L0 393%22 stroke=%22%232b2b2b%22 stroke-opacity=%22.12%22 stroke-width=%222%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%232b2b2b%22 fill-opacity=%22.55%22 font-family=%22Helvetica,Arial,sans-serif%22 font-size=%2228%22 letter-spacing=%224%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3EIMAGE 2%3C/text%3E%3C/svg%3E" alt="Placeholder Image 2" width="524" height="393" draggable="false">
    </figure>
    <figure class="card card--centre" style="--w:623px;--h:482px;--z:3">
      <img src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22609%22 height=%22468%22 viewBox=%220 0 609 468%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23e3d3c4%22/%3E%3Cstop offset=%221%22 stop-color=%22%23b08968%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22609%22 height=%22468%22 fill=%22url%28%23g%29%22/%3E%3Cpath d=%22M0 0L609 468M609 0L0 468%22 stroke=%22%232b2b2b%22 stroke-opacity=%22.12%22 stroke-width=%222%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%232b2b2b%22 fill-opacity=%22.55%22 font-family=%22Helvetica,Arial,sans-serif%22 font-size=%2233%22 letter-spacing=%224%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3EIMAGE 3%3C/text%3E%3C/svg%3E" alt="Placeholder Image 3" width="609" height="468" draggable="false">
    </figure>
    <figure class="card card--right" style="--w:702px;--h:515px;--z:5">
      <img src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22688%22 height=%22501%22 viewBox=%220 0 688 501%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%233a3a3a%22/%3E%3Cstop offset=%221%22 stop-color=%22%23161616%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22688%22 height=%22501%22 fill=%22url%28%23g%29%22/%3E%3Cpath d=%22M0 0L688 501M688 0L0 501%22 stroke=%22%23ffffff%22 stroke-opacity=%22.12%22 stroke-width=%222%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%23ffffff%22 fill-opacity=%22.55%22 font-family=%22Helvetica,Arial,sans-serif%22 font-size=%2235%22 letter-spacing=%224%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3EIMAGE 4%3C/text%3E%3C/svg%3E" alt="Placeholder Image 4" width="688" height="501" draggable="false">
    </figure>
    <figure class="card card--fifth" style="--w:623px;--h:482px;--z:1">
      <img src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22609%22 height=%22468%22 viewBox=%220 0 609 468%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x1=%220%22 y1=%220%22 x2=%221%22 y2=%221%22%3E%3Cstop offset=%220%22 stop-color=%22%23d7cfe0%22/%3E%3Cstop offset=%221%22 stop-color=%22%239a8bb0%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%22609%22 height=%22468%22 fill=%22url%28%23g%29%22/%3E%3Cpath d=%22M0 0L609 468M609 0L0 468%22 stroke=%22%232b2b2b%22 stroke-opacity=%22.12%22 stroke-width=%222%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 fill=%22%232b2b2b%22 fill-opacity=%22.55%22 font-family=%22Helvetica,Arial,sans-serif%22 font-size=%2233%22 letter-spacing=%224%22 text-anchor=%22middle%22 dominant-baseline=%22middle%22%3EIMAGE 5%3C/text%3E%3C/svg%3E" alt="Placeholder Image 5" width="609" height="468" draggable="false">
    </figure>
  </div>
</section>
<div class="mode" role="group" aria-label="Animation style">
  <button type="button" data-mode="graceful" aria-pressed="true">Graceful</button>
  <button type="button" data-mode="snappy" aria-pressed="false">Snappy</button>
</div>

<div class="view-toggle" role="group" aria-label="Preview size">
  <button type="button" data-view="desktop" aria-pressed="true">Desktop</button>
  <button type="button" data-view="mobile" aria-pressed="false">Mobile &middot; Galaxy S26</button>
</div>
<div class="device-stage" id="deviceStage">
  <div class="phone-box" id="phoneBox">
    <div class="phone" id="phone">
      <span class="side power"></span><span class="side vol"></span>
      <div class="screen">
        <div class="statusbar">
          <span id="clock">9:41</span><span class="punch"></span>
          <svg width="46" height="12" viewBox="0 0 46 12" fill="#141414" aria-hidden="true"><rect x="0" y="7" width="2.6" height="5" rx=".7"/><rect x="4.2" y="5" width="2.6" height="7" rx=".7"/><rect x="8.4" y="2.5" width="2.6" height="9.5" rx=".7"/><rect x="12.6" y="0" width="2.6" height="12" rx=".7"/><rect x="21" y="1.5" width="22" height="9" rx="3" fill="none" stroke="#141414" stroke-width="1.3"/><rect x="23" y="3.5" width="18" height="5" rx="1.6"/></svg>
        </div>
        <iframe id="phoneFrame" title="Mobile preview of the generated code"></iframe>
        <span class="gesture"></span>
      </div>
    </div>
  </div>
  <p class="device-note">Galaxy S26 &middot; 360 &times; 780 &middot; your exported code, running as it would on the phone</p>
</div>

<aside class="panel" id="panel" aria-label="Hero controls">
  <div class="panel-head">
    <span class="lab">Controls</span>
    <span class="head-actions">
      <button type="button" class="copy-btn head-copy">Copy code</button>
      <button type="button" class="fold" id="fold" aria-expanded="true" aria-label="Collapse controls">&minus;</button>
    </span>
  </div>
  <div class="panel-body">
    <label class="row">
      <span class="row-top"><span class="lab">Number of cards</span><output id="countOut">4</output></span>
      <input type="range" id="count" min="4" max="12" step="1" value="4">
    </label>
    <label class="row">
      <span class="row-top"><span class="lab">Card size</span><output id="sizeOut">100%</output></span>
      <input type="range" id="size" min="50" max="150" step="5" value="100">
    </label>
    <label class="row">
      <span class="row-top"><span class="lab">Spotlight</span><output id="spotOut">100%</output></span>
      <input type="range" id="spot" min="0" max="100" step="5" value="100">
    </label>
    <label class="row">
      <span class="row-top"><span class="lab">Background blur</span><output id="blurOut">50%</output></span>
      <input type="range" id="blur" min="0" max="100" step="5" value="50">
    </label>
    <div class="code-head">
      <span class="lab">Code <small id="codeSize"></small></span>
      <span class="head-actions">
        <button type="button" class="code-toggle" id="codeToggle" aria-expanded="false">Show code</button>
        <button type="button" class="copy-btn">Copy code</button>
      </span>
    </div>
    <textarea id="code" readonly spellcheck="false" wrap="off" aria-label="Full page code"></textarea>
  </div>
</aside>

<script src="script.js"></script>
<script>
/* ---- Demo controls: sliders + live code. Not part of the exported code. ---- */
/* Pre-fetch the external CSS and JS so buildCode() can inline them synchronously
   for the copy/snippet and the mobile-preview iframe. */
(() => {
  const $ = id => document.getElementById(id);
  const panel = $('panel'), countIn = $('count'), sizeIn = $('size'), spotIn = $('spot'), blurIn = $('blur'), countOut = $('countOut'), sizeOut = $('sizeOut'), spotOut = $('spotOut'), blurOut = $('blurOut');
  const codeEl = $('code'), codeSize = $('codeSize'), copyBtns = [...document.querySelectorAll('.copy-btn')], fold = $('fold'), codeToggle = $('codeToggle');
  const frame = $('phoneFrame'), phone = $('phone'), phoneBox = $('phoneBox'), viewBtns = [...document.querySelectorAll('[data-view]')];
  const src = window.__heroSrc;
  let mobileView = false, reloadTimer;
  let cssSource = '', jsSource = '', sourcesReady = false;

  /* Fetch external files once, then run the rest. */
  Promise.all([
    fetch('style.css').then(r => r.ok ? r.text() : Promise.reject(new Error('Could not load style.css'))),
    fetch('script.js').then(r => r.ok ? r.text() : Promise.reject(new Error('Could not load script.js')))
  ]).then(([stylesheet, source]) => {
    cssSource = stylesheet;
    jsSource = source.split('/* ---- Demo controls')[0];
    sourcesReady = true;
    init();
  }).catch(err => {
    console.error(err);
    sourcesReady = true;
    init();
  });

  function init() {
    /* The full page, with the two settings written into the script. */
    function buildCode() {
      const count = +countIn.value, scale = Number((sizeIn.value / 100).toFixed(2)), spot = Number((spotIn.value / 100).toFixed(2)), blur = Number((blurIn.value / 100).toFixed(2));
      const js = jsSource
        .replace(/const COUNT = [\d.]+;/, 'const COUNT = ' + count + ';')
        .replace(/const SCALE = [\d.]+;/, 'const SCALE = ' + scale + ';')
        .replace(/const SPOT = [\d.]+;/, 'const SPOT = ' + spot + ';')
        .replace(/const BLUR = [\d.]+;/, 'const BLUR = ' + blur + ';');
      return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n' +
        '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<meta name="theme-color" content="#ffffff">\n' +
        '<title>Floating Card Hero</title>\n<style>' + cssSource + '</style>\n</head>\n<body>\n' +
        '<!-- Replace each <img src> below with your own image (about 4:3). Card shape, position and perspective are set by the CSS. -->\n' +
        '<section class="hero" aria-label="Featured work">\n  <div class="stage" id="stage">' + src.cards + '</div>\n</section>\n' +
        src.mode + '\n<script>' + js + '<\/script>\n</body>\n</html>\n';
    }

    let queued = false;
    function showCode() {
      queued = false;
      const code = buildCode();
      codeEl.value = code;
      codeSize.textContent = '\u00b7 ' + (new Blob([code]).size / 1024).toFixed(1) + ' KB';
    }
    function sync() {
      window.heroControls.set(+countIn.value, sizeIn.value / 100, spotIn.value / 100, blurIn.value / 100);
      countOut.textContent = countIn.value + (mobileView && +countIn.value > 8 ? ' \u00b7 phones show 8' : '');
      sizeOut.textContent = sizeIn.value + '%';
      spotOut.textContent = spotIn.value + '%';
      blurOut.textContent = blurIn.value + '%';
      [countIn, sizeIn, spotIn, blurIn].forEach(el => el.style.setProperty('--pct', (el.value - el.min) / (el.max - el.min) * 100 + '%'));
      if (!queued) { queued = true; requestAnimationFrame(showCode); }   // one rebuild per frame, however fast the slider moves
      pushToPhone();
    }
    [countIn, sizeIn, spotIn, blurIn].forEach(el => el.addEventListener('input', sync));
    sync();

    /* ---- Mobile preview: the exported code, running inside a Galaxy S26-sized frame ---- */
    function pushToPhone() {
      if (!mobileView) return;
      try {                                               // same-page call: the phone glides to the new settings, no reload
        frame.contentWindow.heroControls.set(+countIn.value, sizeIn.value / 100, spotIn.value / 100, blurIn.value / 100);
      } catch (_) {                                       // not loaded yet (or blocked): reload with the current code instead
        clearTimeout(reloadTimer);
        reloadTimer = setTimeout(() => { if (mobileView) frame.srcdoc = buildCode(); }, 250);
      }
    }
    function fitPhone() {                                 // shrink the phone to fit short windows (never enlarge it)
      const padL = innerWidth >= 900 ? 440 : 24;
      const sc = Math.max(0.3, Math.min(1, (innerHeight - 64 - 40 - 34) / 800, (innerWidth - padL - 24) / 380));
      phoneBox.style.width = 380 * sc + 'px'; phoneBox.style.height = 800 * sc + 'px';
      phone.style.transform = 'scale(' + sc + ')';
    }
    function setView(v) {
      mobileView = v === 'mobile';
      document.body.classList.toggle('view-mobile', mobileView);
      viewBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
      if (mobileView) {
        clock.textContent = new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit', hour12: false });
        frame.srcdoc = buildCode();                       // the page you would copy, running as-is
        fitPhone();
        if (innerWidth < 900) setFolded(true);            // small window: get the panel out of the phone's way
      } else {
        clearTimeout(reloadTimer); frame.srcdoc = '';     // stops the phone's animation
      }
      sync();
    }
    viewBtns.forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
    addEventListener('resize', () => { if (mobileView) fitPhone(); });

    let timer;
    async function copyCode() {
      let ok = false;
      try { await navigator.clipboard.writeText(codeEl.value); ok = true; } catch (_) {}
      if (!ok) {                                          // clipboard API blocked (e.g. inside a frame): select the text and use the old route
        panel.classList.add('show-code'); codeEl.focus(); codeEl.select();
        try { ok = document.execCommand('copy'); } catch (_) {}
        if (ok) { codeEl.setSelectionRange(0, 0); codeEl.blur(); }
      }
      copyBtns.forEach(b => { b.textContent = ok ? 'Copied' : 'Select & copy'; });
      clearTimeout(timer);
      timer = setTimeout(() => copyBtns.forEach(b => { b.textContent = 'Copy code'; }), 1800);
    }
    copyBtns.forEach(b => b.addEventListener('click', copyCode));

    function setFolded(closed) {
      panel.classList.toggle('is-collapsed', closed);
      fold.setAttribute('aria-expanded', String(!closed));
      fold.setAttribute('aria-label', closed ? 'Expand controls' : 'Collapse controls');
      fold.innerHTML = closed ? '+' : '&minus;';
    }
    fold.addEventListener('click', () => setFolded(!panel.classList.contains('is-collapsed')));
    codeToggle.addEventListener('click', () => {
      const on = panel.classList.toggle('show-code');
      codeToggle.setAttribute('aria-expanded', String(on));
      codeToggle.textContent = on ? 'Hide code' : 'Show code';
    });

    /* Phones start folded, and the page itself never shows more than 8 cards on a small screen */
    if (matchMedia('(max-width: 560px)').matches) setFolded(true);
    if (matchMedia('(pointer: coarse)').matches || innerWidth < 700) { countIn.max = 8; sync(); }
  })();
</script>
</body>
</html>
